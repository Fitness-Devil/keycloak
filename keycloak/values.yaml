replicaCount: 1

image:
  repository: fitnessdevil.azurecr.io/fitnessdevil/keycloak
  tag: "latest"
  pullPolicy: Always

service:
  type: ClusterIP
  port: 8080

management:
  port: 9000

serviceAccount:
  create: false
  automount: false
  annotations: {}
  name: ""

imagePullSecrets:
  - name: acr-pull

livenessProbe:
  httpGet:
    path: /auth/health/live
    port: management
  initialDelaySeconds: 120
  periodSeconds: 10
  readinessProbe:
  httpGet:
    path: /auth/health/ready
    port: management
  initialDelaySeconds: 60
  periodSeconds: 5

extraEnv:
  - name: KC_LOG_LEVEL
    value: DEBUG
  - name: KC_LOG_CONSOLE_COLOR
    value: "true"

# PostgreSQL connection
database:
  enabled: true
  host: "fitnessdevil-db.postgres.database.azure.com"
  port: "5432"
  name: "fitnessdevil_keycloak"
  username: "fitnessdevil"
  # Password from secret
  existingSecret: "core-api-secrets"
  existingSecretKey: "DB_PASSWORD"

# Realm import
realmImport:
  enabled: true
  existingConfigMap: "keycloak-realm"
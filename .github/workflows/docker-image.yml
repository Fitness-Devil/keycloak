name: Docker Image CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Login to Azure Container Registry
      - name: Login to ACR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: azure/docker-login@v2
        with:
          login-server: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      # Build Docker image
      - name: Build Docker image
        run: |
          docker build \
            -t ${{ secrets.ACR_LOGIN_SERVER }}/fitnessdevil/keycloak:${{ github.sha }} \
            -t ${{ secrets.ACR_LOGIN_SERVER }}/fitnessdevil/keycloak:latest \
            .

      # Push Docker image
      - name: Push Docker image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker push ${{ secrets.ACR_LOGIN_SERVER }}/fitnessdevil/keycloak:${{ github.sha }}
          docker push ${{ secrets.ACR_LOGIN_SERVER }}/fitnessdevil/keycloak:latest
